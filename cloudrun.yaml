apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fitforge-agent
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '5'
        run.googleapis.com/cpu-throttling: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/GOOGLE_CLOUD_PROJECT/fitforge-agent:latest
        ports:
        - name: http1
          containerPort: 8501
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
        env:
        - name: GOOGLE_CLOUD_LOCATION
          value: us-central1
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: GEMINI_API_KEY
              key: latest
